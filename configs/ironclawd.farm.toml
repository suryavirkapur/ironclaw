# Loopback farm: one daemon, several agents, no Telegram or bearer token.
# Each agent is a TOML file in manifests_dir. The workspace at /ui lists them all.
execution_mode = "guest_tools"
idle_timeout_minutes = 15
log_level = "info"

[server]
bind = "127.0.0.1"
port = 9938

[ui]
mount = "/ui"
index_file = "index.html"

[storage]
users_root = "../data/farm/users"

[llm]
model = "minimax/minimax-m2.5"
base_url = "https://openrouter.ai/api/v1"
api = "chat_completions"

[firecracker]
enabled = true
kernel_path = "../kernels/firecracker/vmlinux-6.1.155.bin"
rootfs_path = "../rootfs/build/ubuntu-24.04.ext4"
api_socket_dir = "/tmp/ironclaw-farm/fc"
vsock_uds_dir = "/tmp/ironclaw-farm/vsock"
vsock_port = 5000
vcpus = 2
memory_mib = 2048
disk_quota_mb = 512

[farm]
enabled = true
manifests_dir = "../demos/engineering-team/agents"
public_base_url = "http://127.0.0.1:9938"
entry_agent = "product-manager"

[security]
allowed_channels = ["websocket"]

[security.network]
allowed_domains = []

[daemon]
pid_file = "/tmp/ironclaw-farm/ironclawd.pid"
log_file = "/tmp/ironclaw-farm/ironclawd.log"
graceful_timeout_ms = 5000
log_rotate_keep = 5
log_rotate_max_bytes = 10485760

[telegram]
enabled = false

[whatsapp]
enabled = false
session_dir = "../data/farm/whatsapp"
auth_method = "md5"
qr_timeout_ms = 120000
