default_agent = "default"
log_level = "info"

[tools]
allow_bash = true
allow_file = true
allow_browser = true

[browser]
headless = true
timeout_ms = 30000
allowed_domains = ["*"]

[indexing]
max_chunk_bytes = 2048
embedding_model = "text-embedding-3-small"
vector_weight = 0.7
keyword_weight = 0.3
embedding_cache_size = 1000

[scheduler]
jobs_path = "/mnt/brain/cron/jobs.toml"

[execution]
timeout_secs = 120

[network]
allowed_domains = []
