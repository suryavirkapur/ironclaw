# Five-person engineering-team demo controlled from one owner-only Telegram bot.
execution_mode = "guest_tools"
idle_timeout_minutes = 10
log_level = "info"

[server]
bind = "127.0.0.1"
port = 9938

[ui]
mount = "/ui"
index_file = "index.html"

[storage]
users_root = "../data/engineering-team/users"

[llm]
model = "minimax/minimax-m2.5"
base_url = "https://openrouter.ai/api/v1"
api = "chat_completions"

[firecracker]
enabled = true
# The team communicates with the host over vsock and uses TAP for controlled guest internet access.
# Run the host daemon with CAP_NET_ADMIN/root so it can provision TAP and firewall rules.
enable_network = true
kernel_path = "../kernels/firecracker/vmlinux-6.1.155.bin"
rootfs_path = "../rootfs/build/ubuntu-24.04.ext4"
api_socket_dir = "/tmp/ironclaw-engineering-team/fc"
vsock_uds_dir = "/tmp/ironclaw-engineering-team/vsock"
vsock_port = 5000
vcpus = 2
memory_mib = 2048
disk_quota_mb = 512

[farm]
enabled = true
manifests_dir = "../demos/engineering-team/agents"
public_base_url = "http://127.0.0.1:9938"
entry_agent = "product-manager"

[telegram]
enabled = true
poll_timeout_seconds = 2

[security]
allowed_channels = ["telegram", "websocket"]

[security.control_plane]
enabled = true

[[security.control_plane.principals]]
id = "engineering-owner"
organization_id = "engineering-demo"
role = "admin"
token_env = "IRONCLAW_CONTROL_PLANE_TOKEN"
default_agent = "product-manager"
allowed_agents = []

[security.network]
allowed_domains = []

[daemon]
pid_file = "/tmp/ironclaw-engineering-team/ironclawd.pid"
log_file = "/tmp/ironclaw-engineering-team/ironclawd.log"
graceful_timeout_ms = 5000
log_rotate_keep = 5
log_rotate_max_bytes = 10485760

[whatsapp]
enabled = false
session_dir = "../data/engineering-team/whatsapp"
auth_method = "md5"
qr_timeout_ms = 120000
