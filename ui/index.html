<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ironclaw admin</title>
    <link rel="stylesheet" href="/ui/app.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">ironclaw 0.10.1</p>
          <h1>host admin panel</h1>
          <p class="subtitle">host memory, vm runtime, key vault, heartbeat monitor</p>
        </div>
        <div class="header-actions">
          <span class="badge" id="status">idle</span>
          <button id="refresh">refresh</button>
        </div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>heartbeat</h2>
        </div>
        <div class="panel-body" id="heartbeat"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>active microvms</h2>
        </div>
        <div class="panel-body" id="vms"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>host api keys</h2>
        </div>
        <div class="panel-body">
          <form id="key-form" class="key-form">
            <input id="key-name" type="text" placeholder="key name (example: openai_api_key)" />
            <input id="key-value" type="password" placeholder="secret value" />
            <button type="submit">store</button>
          </form>
          <div id="keys"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>memory</h2>
        </div>
        <div class="panel-body" id="memory"></div>
      </section>
    </main>
    <script src="/ui/app.js"></script>
  </body>
</html>
