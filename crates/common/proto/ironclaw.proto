syntax = "proto3";

package ironclaw;

message MessageEnvelope {
  string user_id = 1;
  string session_id = 2;
  uint64 msg_id = 3;
  uint64 timestamp_ms = 4;

  // Capability token required by the host for all non-auth messages.
  // Provided by host via AuthChallenge.
  string cap_token = 5;

  oneof payload {
    AuthChallenge auth_challenge = 9;
    AuthAck auth_ack = 8;
    AgentControl agent_control = 18;
    AgentState agent_state = 19;
    Artifact artifact = 20;
    UploadedFile uploaded_file = 21;
    AgentTaskRequest agent_task_request = 22;
    AgentTaskUpdate agent_task_update = 23;

    UserMessage user_message = 10;
    ToolCallRequest tool_call_request = 16;
    ToolCallResponse tool_call_response = 17;

    ToolResult tool_result = 11;
    StreamDelta stream_delta = 12;
    JobTrigger job_trigger = 13;
    JobStatus job_status = 14;
    FileOpRequest file_op_request = 15;
  }
}

message AuthChallenge {
  string cap_token = 1;
  repeated string allowed_tools = 2;
  string execution_mode = 3;
  // Ephemeral host-to-guest credential. Never persist this in the guest image.
  string brave_api_key = 4;
  // Validated farm manifest for this agent. The guest uses it to register
  // Wasm tools; it contains no credentials.
  string agent_manifest_toml = 5;
}

message AuthAck {
  string cap_token = 1;
}

message AgentControl {
  enum Command {
    SLEEP = 0;
    WAKE = 1;
    SHUTDOWN = 2;
  }

  Command command = 1;
  string reason = 2;
}

message AgentState {
  string state = 1;
  string detail = 2;
}

message UserMessage {
  string text = 1;
}

message ToolCallRequest {
  uint64 call_id = 1;
  string tool = 2;
  string input = 3;
}

message ToolCallResponse {
  uint64 call_id = 1;
  bool ok = 2;
  string output = 3;
}

message ToolResult {
  string tool = 1;
  string output = 2;
  bool ok = 3;
}

message StreamDelta {
  string delta = 1;
  bool done = 2;
}

message Artifact {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
  string caption = 4;
}

message UploadedFile {
  string filename = 1;
  string mime_type = 2;
  bytes data = 3;
  string prompt = 4;
}

message AgentTaskRequest {
  string task_id = 1;
  string context_id = 2;
  string parent_task_id = 3;
  string requester = 4;
  string skill = 5;
  string input_json = 6;
  uint32 delegation_depth = 7;
}

message AgentTaskUpdate {
  string task_id = 1;
  string state = 2;
  string output_json = 3;
  repeated string artifact_ids = 4;
  string error = 5;
}

message JobTrigger {
  string job_id = 1;
}

message JobStatus {
  string job_id = 1;
  string status = 2;
}

message FileOpRequest {
  string op = 1;
  string path = 2;
  optional string data = 3;
}
