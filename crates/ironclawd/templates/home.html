<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ironclaw host</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f1724;
        --panel: #111b2a;
        --fg: #f2f6fa;
        --muted: #91a3b7;
        --line: #2d3f55;
        --accent: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "ibm plex mono", "space mono", ui-monospace, monospace;
        background: radial-gradient(circle at 20% 10%, #15243a 0, #0f1724 45%, #0b1220 100%);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(780px, 100%);
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 88%, #000 12%);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        text-decoration: none;
        color: var(--fg);
        border: 1px solid var(--line);
        padding: 14px 16px;
      }

      a:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ironclaw host daemon</h1>
      <p>security-first runtime with strict host/guest separation</p>
      <nav>
        <a href="/ui">open admin panel</a>
        <a href="/api/docs">open api docs</a>
        <a href="/api/health">health probe</a>
      </nav>
    </main>
  </body>
</html>
