[package]
name = "irowclaw"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "*"
base64 = "*"
chrono = "*"
common = { path = "../common" }
farm = { path = "../farm", features = ["wasm-runtime"] }
hex = "*"
memory = { path = "../memory" }
rusqlite = { version = "*", features = ["bundled"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha2 = "*"
tokio = { version = "*", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time", "process"] }
tokio-vsock = "*"
toml = "*"
tracing = "*"
tools = { path = "../tools" }
