[package]
name = "core-agent-memory-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js N-API bindings for core-agent-memory"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
core-agent-memory = { path = "../core", default-features = false }
napi = { version = "3.12", default-features = false, features = ["napi8"] }
napi-derive = "3.6"
serde_json = "1"

[build-dependencies]
napi-build = "2.4"

